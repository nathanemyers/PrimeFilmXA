# Pacific Image PrimeFilm XA. SANE lists this line as "Reflecta RPS 10M (aka PrimeFilm XAs)";
# the XA itself reports vendor "PIE", model "MF Scanner" (verified 2026-11-09).
# Last field 0x01 = slide transport: lets pieusb move the film strip (`advance` option).
# Upstream ships 0x00, which ignores `advance`. Verified on the XA 2026-11-09
# (specs/002-film-scan/hardware-validation.md, E1–E3); command 0x17 is accepted, so not 0x03.
usb 0x05e3 0x0144 0x0048 0x01
