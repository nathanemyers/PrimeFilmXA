[package]
name = "primefilm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Command-line tool for the Pacific Image PrimeFilm XA film scanner"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "primefilm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ctrlc = "3"
jiff = "0.2"

[dev-dependencies]
# Test-only: an independent TIFF decoder to check our own TIFF writer (research D11).
tiff = "0.11"

# Constitution Principle VI: no unwrap()/expect() outside tests unless proven safe.
# Combined with `cargo clippy -- -D warnings`, these warnings fail the build.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
